<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>SAKURAYA Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Shippori+Mincho+B1:wght@600;800&display=swap" rel="stylesheet">
<style>
/* Layout concept: deep-indigo masthead with a seigaiha wave texture over a cool paper workspace.
   Each role is a "pane" (two panes can sit side by side for presenting). Vermilion is reserved for the one primary action on screen. */
:root {
  --paper: #EEF0EC; --card: #FFFFFF; --sunken: #E4E8E1; --ink: #17213D; --ink2: #4B5775; --ink3: #6B7694; --line: #D3D9D0;
  --band: #16213F; --band2: #22335C; --band-ink: #F2F0E8;
  --shu: #C93A2B; --shu-ink: #FFFFFF; --shu-soft: #FBE6E2;
  --gold: #B2812A; --gold-soft: #F6EBD0; --matcha: #3E7C54; --matcha-soft: #DDEEE2;
  --info: #2D5E9E; --info-soft: #DCE8F7; --warn: #A86A12; --warn-soft: #F8E9CC; --bad: #B5322A; --bad-soft: #F9DEDA;
  --s1: #2A78D6; --s2: #EB6834; --s3: #1BAF7A;
  --shadow: 0 1px 2px rgba(22, 33, 63, .08), 0 10px 28px rgba(22, 33, 63, .08);
  --r: 14px; --r-sm: 9px;
  --f-disp: 'Shippori Mincho B1', 'Noto Serif Thai', 'Noto Serif', serif;
  --f-body: 'Noto Sans Thai', 'Sarabun', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1527; --card: #172038; --sunken: #111A2F; --ink: #E8ECF6; --ink2: #A9B3CD; --ink3: #8591B0; --line: #2B3756;
    --band: #101A34; --band2: #1D2C57; --shu: #DB4A39; --shu-soft: #3A1E22;
    --gold: #D8A44A; --gold-soft: #3A2F18; --matcha: #5FAE7A; --matcha-soft: #1B3326;
    --info: #6FA3E8; --info-soft: #1B2D4A; --warn: #E0A04A; --warn-soft: #3A2D16; --bad: #E56A5E; --bad-soft: #3B1D1D;
    --s1: #3987E5; --s2: #D95926; --s3: #199E70;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1527; --card: #172038; --sunken: #111A2F; --ink: #E8ECF6; --ink2: #A9B3CD; --ink3: #8591B0; --line: #2B3756;
  --band: #101A34; --band2: #1D2C57; --shu: #DB4A39; --shu-soft: #3A1E22;
  --gold: #D8A44A; --gold-soft: #3A2F18; --matcha: #5FAE7A; --matcha-soft: #1B3326;
  --info: #6FA3E8; --info-soft: #1B2D4A; --warn: #E0A04A; --warn-soft: #3A2D16; --bad: #E56A5E; --bad-soft: #3B1D1D;
  --s1: #3987E5; --s2: #D95926; --s3: #199E70;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper); color: var(--ink); font: 400 15px/1.55 var(--f-body);
    -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; font-family: var(--f-disp); font-weight: 800; letter-spacing: .01em; text-wrap: balance; line-height: 1.25; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink2); } .faint { color: var(--ink3); }
:focus-visible { outline: 3px solid var(--info); outline-offset: 2px; border-radius: 6px; }

/* ---------- masthead ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background-color: var(--band); color: var(--band-ink);
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='24' viewBox='0 0 48 24'><g fill='none' stroke='white' stroke-opacity='.09' stroke-width='1.2'><circle cx='24' cy='24' r='22'/><circle cx='24' cy='24' r='16'/><circle cx='24' cy='24' r='10'/><circle cx='0' cy='12' r='22'/><circle cx='0' cy='12' r='16'/><circle cx='0' cy='12' r='10'/><circle cx='48' cy='12' r='22'/><circle cx='48' cy='12' r='16'/><circle cx='48' cy='12' r='10'/></g></svg>");
  border-bottom: 3px solid var(--shu);
}
.top-in { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px max(16px, env(safe-area-inset-left, 0px)) 10px max(16px, env(safe-area-inset-right, 0px)); max-width: 1900px; margin: 0 auto; }
.brand { display: flex; align-items: center; gap: 12px; margin-right: auto; min-width: 0; }
.brand .mark { width: 40px; height: 40px; border-radius: 10px; background: var(--shu); display: grid; place-items: center; font-family: var(--f-disp); font-weight: 800; font-size: 22px; color: #fff; flex: none; box-shadow: 0 0 0 2px rgba(255, 255, 255, .25) inset; }
.brand b { font-family: var(--f-disp); font-size: 20px; letter-spacing: .14em; display: block; line-height: 1.1; }
.brand small { opacity: .75; font-size: 12px; display: block; }
.top-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.tbtn { background: rgba(255, 255, 255, .1); color: var(--band-ink); border: 1px solid rgba(255, 255, 255, .22); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; transition: background .15s; }
.tbtn:hover { background: rgba(255, 255, 255, .2); }
.tbtn[aria-pressed="true"] { background: var(--band-ink); color: var(--band); border-color: var(--band-ink); }
.tbtn svg { width: 15px; height: 15px; }

/* ---------- stage & panes ---------- */
.stage { display: grid; gap: 14px; padding: 14px max(16px, env(safe-area-inset-left, 0px)) 90px max(16px, env(safe-area-inset-right, 0px)); max-width: 1900px; margin: 0 auto; grid-template-columns: minmax(0, 1fr); }
.stage.split { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 1099px) { .stage.split { grid-template-columns: minmax(0, 1fr); } .split-only { display: none !important; } }
.pane { position: relative; background: var(--sunken); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; container-type: inline-size; container-name: pane; display: flex; flex-direction: column; min-height: 0; }
.stage.split .pane { height: calc(100dvh - 150px); min-height: 520px; }
.pane-head { background: var(--card); border-bottom: 1px solid var(--line); padding: 8px 10px 0; }
.roletabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-bottom: 8px; }
.roletab { border: 0; background: transparent; color: var(--ink2); padding: 7px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap; font-weight: 500; display: inline-flex; gap: 7px; align-items: center; transition: background .15s, color .15s; }
.roletab:hover { background: var(--sunken); }
.roletab[aria-selected="true"] { background: var(--band); color: var(--band-ink); }
.roletab svg { width: 16px; height: 16px; }
.roletab .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--matcha); }
.subtabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin: 0 -2px; }
.subtab { border: 0; background: transparent; padding: 9px 14px; cursor: pointer; color: var(--ink2); font-weight: 500; border-bottom: 3px solid transparent; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.subtab:hover { color: var(--ink); }
.subtab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--shu); font-weight: 700; }
.subtab .badge { background: var(--shu); color: var(--shu-ink); border-radius: 999px; font-size: 11px; min-width: 19px; height: 19px; padding: 0 5px; display: inline-grid; place-items: center; font-weight: 700; }
.pane-body { flex: 1; overflow: auto; padding: 16px; position: relative; scroll-behavior: smooth; }
.stage:not(.split) .pane-body { overflow: visible; min-height: 70vh; }
.pane-body.enter > .view { animation: rise .35s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.pane-overlay { position: absolute; inset: 0; z-index: 12; pointer-events: none; }
.pane-overlay > * { pointer-events: auto; }
.stage:not(.split) .pane-overlay { position: fixed; z-index: 40; }

/* ---------- generic ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.card.flat { box-shadow: none; }
.card h3 { font-size: 18px; margin-bottom: 4px; }
.sec-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 4px 0 12px; }
.sec-title h2 { font-size: 22px; }
.sec-title p { font-size: 13px; color: var(--ink2); }
.stack { display: grid; gap: 14px; min-width: 0; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; min-width: 0; }
.row.between { justify-content: space-between; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.cols2 { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@container pane (min-width: 860px) { .cols2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .cols2.w21 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); } .cols2.w12 { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); } }

.btn { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 9px 16px; cursor: pointer; font-weight: 600; display: inline-flex; gap: 7px; align-items: center; justify-content: center; transition: transform .12s, box-shadow .12s, background .15s; min-height: 40px; }
.btn:hover { background: var(--sunken); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--shu); border-color: var(--shu); color: var(--shu-ink); box-shadow: 0 6px 16px color-mix(in srgb, var(--shu) 30%, transparent); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.indigo { background: var(--band2); border-color: var(--band2); color: #fff; }
.btn.ok { background: var(--matcha); border-color: var(--matcha); color: #fff; }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.btn.sm { padding: 5px 11px; min-height: 32px; font-size: 13px; border-radius: 8px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; box-shadow: none; }
.btn svg { width: 16px; height: 16px; flex: none; }
.iconbtn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); cursor: pointer; display: inline-grid; place-items: center; }
.iconbtn:hover { background: var(--sunken); } .iconbtn svg { width: 16px; height: 16px; }

.field { display: grid; gap: 5px; min-width: 0; }
.field > span, .lbl { font-size: 13px; color: var(--ink2); font-weight: 500; }
.in, select.in, textarea.in { width: 100%; border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 9px 12px; min-height: 42px; }
.in:focus { outline: 3px solid color-mix(in srgb, var(--info) 45%, transparent); border-color: var(--info); }
.in.err { border-color: var(--bad); }
.fgrid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--paper); }
.stepper button { width: 38px; height: 40px; border: 0; background: transparent; cursor: pointer; font-size: 18px; }
.stepper button:hover { background: var(--sunken); }
.stepper b { min-width: 40px; text-align: center; font-variant-numeric: tabular-nums; }
.msg { border-radius: 10px; padding: 10px 12px; font-size: 14px; display: flex; gap: 9px; align-items: flex-start; }
.msg svg { width: 18px; height: 18px; flex: none; margin-top: 2px; }
.msg.err { background: var(--bad-soft); color: var(--bad); } .msg.ok { background: var(--matcha-soft); color: var(--matcha); }
.msg.warn { background: var(--warn-soft); color: var(--warn); } .msg.info { background: var(--info-soft); color: var(--info); }
.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; background: var(--sunken); color: var(--ink2); white-space: nowrap; }
.pill.ok { background: var(--matcha-soft); color: var(--matcha); } .pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); } .pill.info { background: var(--info-soft); color: var(--info); } .pill.gold { background: var(--gold-soft); color: var(--gold); }
.pill.shu { background: var(--shu-soft); color: var(--shu); }
.pill svg { width: 12px; height: 12px; }
.uc { display: none; font: 600 10.5px/1 var(--f-body); letter-spacing: .04em; color: var(--info); background: var(--info-soft); border: 1px solid color-mix(in srgb, var(--info) 35%, transparent); border-radius: 6px; padding: 3px 6px; vertical-align: middle; margin-left: 6px; white-space: nowrap; }
body.show-uc .uc { display: inline-block; }
.empty { text-align: center; color: var(--ink2); padding: 28px 12px; border: 2px dashed var(--line); border-radius: var(--r); }
.hint { font-size: 12.5px; color: var(--ink2); }
kbd, .code { font: 600 12.5px/1 ui-monospace, 'SF Mono', Menlo, monospace; background: var(--sunken); border: 1px solid var(--line); border-radius: 6px; padding: 3px 7px; }
button.code { cursor: pointer; } button.code:hover { background: var(--line); }
hr.div { border: 0; border-top: 1px dashed var(--line); margin: 12px 0; }

/* ---------- home ---------- */
.hero { position: relative; overflow: hidden; border-radius: 20px; background: var(--band); color: var(--band-ink); padding: 34px 28px; isolation: isolate;
  background-image: radial-gradient(circle at 85% 20%, color-mix(in srgb, var(--shu) 55%, transparent), transparent 42%), url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='24' viewBox='0 0 48 24'><g fill='none' stroke='white' stroke-opacity='.08' stroke-width='1.2'><circle cx='24' cy='24' r='22'/><circle cx='24' cy='24' r='16'/><circle cx='24' cy='24' r='10'/><circle cx='0' cy='12' r='22'/><circle cx='0' cy='12' r='16'/><circle cx='0' cy='12' r='10'/><circle cx='48' cy='12' r='22'/><circle cx='48' cy='12' r='16'/><circle cx='48' cy='12' r='10'/></g></svg>"); }
.hero .kanji { position: absolute; right: -10px; top: -30px; font-family: var(--f-disp); font-weight: 800; font-size: clamp(120px, 24cqw, 260px); opacity: .1; line-height: 1; z-index: -1; user-select: none; }
.hero h1 { font-size: clamp(28px, 5.4cqw, 46px); max-width: 16ch; }
.hero p { max-width: 54ch; opacity: .9; margin-top: 10px; }
.hero .row { margin-top: 18px; }
.eyebrow { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; opacity: .8; margin-bottom: 8px; }
.petal { position: absolute; top: -20px; width: 14px; height: 14px; background: var(--sakura, #F2B3C0); border-radius: 150% 0 150% 0; opacity: .0; animation: fall linear infinite; z-index: -1; }
@keyframes fall { 0% { transform: translate(0, -20px) rotate(0); opacity: 0; } 10% { opacity: .75; } 100% { transform: translate(-90px, 340px) rotate(420deg); opacity: 0; } }
.roles { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); margin-top: 16px; }
.rolecard { text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: var(--r); padding: 16px; cursor: pointer; display: grid; gap: 8px; transition: transform .15s, box-shadow .15s, border-color .15s; box-shadow: var(--shadow); }
.rolecard:hover { transform: translateY(-3px); border-color: var(--shu); }
.rolecard .ico { width: 46px; height: 46px; border-radius: 12px; background: var(--band); color: var(--band-ink); display: grid; place-items: center; }
.rolecard .ico svg { width: 24px; height: 24px; }
.rolecard h3 { font-size: 19px; } .rolecard p { font-size: 13.5px; color: var(--ink2); }
.rolecard ul { margin: 0; padding-left: 18px; font-size: 13px; color: var(--ink2); }
.journey { display: flex; gap: 0; overflow-x: auto; padding: 6px 2px 10px; margin-top: 8px; counter-reset: j; }
.journey .step { flex: 1 0 118px; position: relative; padding: 0 6px; text-align: center; font-size: 13px; }
.journey .step::before { content: ''; position: absolute; top: 19px; left: -50%; right: 50%; border-top: 2px dashed var(--line); z-index: 0; }
.journey .step:first-child::before { display: none; }
.journey .bub { position: relative; z-index: 1; width: 40px; height: 40px; margin: 0 auto 8px; border-radius: 50%; display: grid; place-items: center; background: var(--card); border: 2px solid var(--shu); color: var(--shu); }
.journey .bub svg { width: 19px; height: 19px; }
.facts { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 140px), 1fr)); }
.fact { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.fact b { display: block; font: 800 26px/1.1 var(--f-disp); font-variant-numeric: tabular-nums; } .fact span { font-size: 12.5px; color: var(--ink2); }

/* ---------- menu ---------- */
.catbar { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: thin; }
.cat { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 16px; cursor: pointer; display: inline-flex; gap: 8px; align-items: baseline; font-weight: 600; }
.cat small { font-family: var(--f-disp); color: var(--ink3); font-size: 13px; }
.cat[aria-pressed="true"] { background: var(--band); color: var(--band-ink); border-color: var(--band); } .cat[aria-pressed="true"] small { color: var(--band-ink); opacity: .7; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.searchbox { position: relative; flex: 1 1 220px; }
.searchbox svg { position: absolute; left: 12px; top: 50%; translate: 0 -50%; width: 17px; height: 17px; color: var(--ink3); }
.searchbox .in { padding-left: 38px; }
.chk { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; font-size: 13px; cursor: pointer; background: var(--card); user-select: none; }
.chk[aria-pressed="true"] { background: var(--warn-soft); color: var(--warn); border-color: var(--warn); font-weight: 600; }
.menu-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); margin-top: 12px; }
.dish { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; transition: transform .18s, box-shadow .18s; position: relative; }
.dish:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.dish .pic { position: relative; aspect-ratio: 4 / 3; overflow: hidden; background: var(--sunken); }
.art { width: 100%; height: 100%; display: block; transition: transform .35s; } .dish:hover .art { transform: scale(1.06) rotate(-1deg); }
.dish .ja { position: absolute; left: 10px; bottom: 6px; font-family: var(--f-disp); font-weight: 800; color: #fff; text-shadow: 0 1px 8px rgba(0, 0, 0, .55); font-size: 15px; }
.dish .tag { position: absolute; left: 8px; top: 8px; }
.dish .body { padding: 11px 13px 13px; display: grid; gap: 6px; flex: 1; align-content: start; }
.dish h4 { font-family: var(--f-body); font-size: 15.5px; font-weight: 700; }
.dish .desc { font-size: 12.5px; color: var(--ink2); line-height: 1.45; }
.dish .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; padding-top: 6px; }
.price { font: 800 19px/1 var(--f-disp); font-variant-numeric: tabular-nums; }
.alls { display: flex; gap: 4px; flex-wrap: wrap; }
.alls .a { font-size: 11px; border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; color: var(--ink2); background: var(--paper); }
.alls .a.hit { background: var(--warn-soft); color: var(--warn); border-color: var(--warn); font-weight: 600; }
.dish.sold .pic::after { content: 'หมด'; position: absolute; inset: 0; display: grid; place-items: center; background: rgba(15, 21, 39, .62); color: #fff; font: 800 34px var(--f-disp); letter-spacing: .1em; }
.dish.sold { opacity: .85; }
.stockleft { font-size: 12px; color: var(--warn); font-weight: 600; }
.spicy { color: var(--shu); font-size: 12px; font-weight: 700; }
.carttab { position: sticky; bottom: 4px; display: flex; justify-content: center; margin-top: 16px; z-index: 5; pointer-events: none; }
.carttab .btn { pointer-events: auto; padding: 12px 22px; min-height: 48px; box-shadow: 0 14px 34px rgba(22, 33, 63, .35); }
.bump { animation: bump .35s; } @keyframes bump { 40% { transform: scale(1.12); } }

/* cart sheet */
.sheet-wrap { position: absolute; inset: 0; background: rgba(10, 15, 30, .5); display: flex; justify-content: flex-end; animation: fade .2s; }

/* QR-like pattern (sample only, not scannable) */
function qrSVG(seed, label) {
  let x = 0; for (let i = 0; i < seed.length; i++) x = (x * 31 + seed.charCodeAt(i)) >>> 0;
  const rnd = () => { x ^= x << 13; x >>>= 0; x ^= x >>> 17; x ^= x << 5; x >>>= 0; return x / 4294967296; };
  const n = 25, c = 6; let r = '';
  const finder = (ox, oy) => `<rect x="${ox * c}" y="${oy * c}" width="${7 * c}" height="${7 * c}" fill="currentColor"/><rect x="${(ox + 1) * c}" y="${(oy + 1) * c}" width="${5 * c}" height="${5 * c}" fill="var(--card)"/><rect x="${(ox + 2) * c}" y="${(oy + 2) * c}" width="${3 * c}" height="${3 * c}" fill="currentColor"/>`;
  const inF = (i, j) => (i < 8 && j < 8) || (i > n - 9 && j < 8) || (i < 8 && j > n - 9);
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) { if (inF(i, j)) continue; if (rnd() > 0.52) r += `<rect x="${i * c}" y="${j * c}" width="${c}" height="${c}" fill="currentColor"/>`; }
  return `<svg class="qr" viewBox="-6 -6 ${n * c + 12} ${n * c + 12}" role="img" aria-label="${label || 'QR Code ตัวอย่าง'}">${r}${finder(0, 0)}${finder(n - 7, 0)}${finder(0, n - 7)}</svg>`;
}

/* ===== core.js : clock, state, rules (all in-memory, no database) ===== */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const baht = n => '฿' + Math.round(n).toLocaleString('en-US');
const pad2 = n => String(n).padStart(2, '0');

/* simulated clock so the demo can run 10x / 60x faster */
const Clock = {
  speed: 1, base: Date.now(), real: Date.now(),
  now() { return this.base + (Date.now() - this.real) * this.speed; },
  set(s) { this.base = this.now(); this.real = Date.now(); this.speed = s; }
};
const hhmm = ms => { const d = new Date(ms); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };
const isoDate = ms => { const d = new Date(ms); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };

function logEv(role, text) { S.log.unshift({ at: Clock.now(), role, text }); if (S.log.length > 60) S.log.pop(); }

/* ---------- toasts ---------- */
function toast(msg, kind) {
  const box = $('#toasts'); if (!box) return;
  const el = document.createElement('div'); el.className = 'toast ' + (kind || 'info'); el.textContent = msg; el.setAttribute('role', 'status');
  box.appendChild(el); setTimeout(() => el.classList.add('out'), 3600); setTimeout(() => el.remove(), 4000);
  while (box.children.length > 4) box.firstChild.remove();
}
function notify(role, text, kind) {
  logEv(role, text);
  if (typeof visibleRoles === 'function' && visibleRoles().indexOf(role) >= 0) toast(text, kind || 'info');
}

/* ---------- login (UC-01): 5 wrong attempts lock 5 minutes ---------- */
function lockLeft(role, user) {
  const L = S.lock[role + ':' + String(user || '').trim().toLowerCase()];
  return L && L.until > Clock.now() ? L.until - Clock.now() : 0;
}
function attemptLogin(role, user, pass) {
  user = String(user || '').trim().toLowerCase();
  const key = role + ':' + user, L = S.lock[key] || (S.lock[key] = { fails: 0, until: 0 }), now = Clock.now();
  if (L.until > now) return { ok: false, locked: true, left: L.until - now };
  if (L.until && L.until <= now) { L.fails = 0; L.until = 0; }
  const acc = role === 'customer' ? MEMBERS.find(m => m.user === user) : (STAFF_ACCOUNTS[role].user === user ? STAFF_ACCOUNTS[role] : null);
  if (acc && acc.pass === pass) { L.fails = 0; const a = { type: 'member', name: acc.name, user: acc.user }; if (role === 'customer') S.cust.auth = a; else S.auth[role] = a; logEv(role, 'เข้าสู่ระบบ: ' + acc.name); return { ok: true }; }
  L.fails++;
  if (L.fails >= 5) { L.until = now + 5 * 60000; logEv(role, 'ล็อกบัญชี ' + user + ' 5 นาที'); return { ok: false, locked: true, left: 5 * 60000 }; }
  return { ok: false, left: 5 - L.fails };
}
function logout(role) { if (role === 'customer') S.cust.auth = null; else S.auth[role] = null; }

/* ---------- booking (UC-07) ---------- */
function findTableFor(date, time, people) {
  const st = toMin(time);
  return S.tables.filter(t => t.seats >= people).sort((a, b) => a.seats - b.seats)
    .find(t => !S.bookings.some(b => b.status !== 'cancelled' && b.status !== 'noshow' && b.date === date && b.tableId === t.id && Math.abs(toMin(b.time) - st) < 120));
}
function slotIsPast(date, time) {
  const n = Clock.now(); if (date !== isoDate(n)) return date < isoDate(n);
  const d = new Date(n); return toMin(time) <= d.getHours() * 60 + d.getMinutes();
}
function makeBooking(f) {
  const name = (f.name || '').trim(), phone = (f.phone || '').replace(/\D/g, '');
  if (!name) return { ok: false, field: 'name', msg: 'กรุณากรอกชื่อผู้จอง' };
  if (phone.length < 9 || phone.length > 10) return { ok: false, field: 'phone', msg: 'เบอร์โทรต้องมี 9–10 หลัก' };
  if (!f.date) return { ok: false, field: 'date', msg: 'กรุณาเลือกวันที่' };
  if (slotIsPast(f.date, f.time)) return { ok: false, field: 'time', msg: 'เวลานี้ผ่านไปแล้ว เลือกเวลาถัดไป' };
  if (S.bookings.some(b => b.status === 'booked' && b.phone === phone && b.date === f.date && b.time === f.time)) return { ok: false, code: 'dup', msg: 'เบอร์นี้จองวันและเวลาเดียวกันไว้แล้ว (จองซ้ำ) กรุณาแก้ข้อมูลแล้วส่งใหม่' };
  const t = findTableFor(f.date, f.time, f.people);
  if (!t) {
    const alts = SLOT_TIMES.filter(x => !slotIsPast(f.date, x) && findTableFor(f.date, x, f.people)).sort((a, b) => Math.abs(toMin(a) - toMin(f.time)) - Math.abs(toMin(b) - toMin(f.time))).slice(0, 4).sort();
    return { ok: false, code: 'full', msg: 'ไม่มีโต๊ะว่างสำหรับ ' + f.people + ' คน ในเวลา ' + f.time + ' น.', alts };
  }
  const b = { no: 'BK-' + String(S.bookSeq++).padStart(4, '0'), name, phone, date: f.date, time: f.time, people: f.people, tableId: t.id, status: 'booked', mine: true };
  S.bookings.push(b); S.cust.myBookings.push(b.no); logEv('customer', 'จองโต๊ะ ' + b.no + ' (T' + t.id + ')');
  notify('staff', 'มีการจองใหม่ ' + b.no + ' · ' + b.people + ' คน · ' + b.time + ' น.');
  return { ok: true, booking: b };
}
function cancelBooking(no) { const b = S.bookings.find(x => x.no === no); if (b && b.status === 'booked') { b.status = 'cancelled'; logEv('customer', 'ยกเลิกการจอง ' + no); } }

/* ---------- queue (UC-06, UC-09) ---------- */
const QUEUE_NOSHOW_MS = 10 * 60000;
const queueAhead = no => { const l = S.queue.list; const i = l.findIndex(q => q.no === no); if (i < 0) return 0; return l.slice(0, i).filter(q => q.status === 'waiting').length; };
function takeQueue(name, people) {

  S.queue.list.push({ no, name: name.trim() || 'ลูกค้า', people, status: 'waiting', at: Clock.now(), mine: true });
  S.cust.queueNo = no; notify('staff', 'คิวใหม่ ' + no + ' (' + people + ' คน)'); return no;
}
function callNextQueue() {
  const q = S.queue.list.find(x => x.status === 'waiting'); if (!q) return null;
  q.status = 'called'; q.calledAt = Clock.now(); logEv('staff', 'เรียกคิว ' + q.no);
  if (q.mine) toast('ถึงคิวของคุณแล้ว ' + q.no + ' กรุณามาที่หน้าร้านภายใน 10 นาที', 'ok');

}
function skipQueue(no, auto) {
  const q = S.queue.list.find(x => x.no === no); if (!q) return;
  q.status = 'skipped'; logEv('staff', (auto ? 'ข้ามคิวอัตโนมัติ (ไม่มาภายใน 10 นาที) ' : 'ข้ามคิว ') + no);
  if (auto) notify('staff', 'คิว ' + no + ' ไม่มาภายใน 10 นาที ข้ามไปคิวถัดไป', 'warn');
}
function freeTablesFor(people) { return S.tables.filter(t => t.status === 'free' && t.seats >= people).sort((a, b) => a.seats - b.seats); }
function seatQueue(no, tableId) {
  const q = S.queue.list.find(x => x.no === no), t = tableOf(tableId); if (!q || !t || t.status !== 'free') return false;
  q.status = 'seated'; q.tableId = tableId; t.status = 'occupied'; t.claimed = false;
  if (q.mine) S.cust.seated = tableId;
  logEv('staff', 'จัดโต๊ะ T' + tableId + ' ให้คิว ' + no); return true;
}
function confirmArrival(no, tableId) {
  const b = S.bookings.find(x => x.no === no); if (!b || b.status !== 'booked') return false;
  let t = tableOf(tableId || b.tableId);
  if (!t || t.status !== 'free') t = freeTablesFor(b.people)[0];
  if (!t) return false;
  b.status = 'arrived'; b.seatedTable = t.id; t.status = 'occupied'; t.claimed = false;
  if (b.mine) S.cust.seated = t.id;
  logEv('staff', 'ยืนยันการมาถึง ' + no + ' → T' + t.id); return true;
}
function setTableStatus(id, st) {

}
const TABLE_STATUS = { free: { label: 'ว่าง' }, occupied: { label: 'มีลูกค้า' }, cleaning: { label: 'ทำความสะอาด' }, reserved: { label: 'จอง' } };

/* ---------- ordering (UC-04, UC-13, UC-16) ---------- */
function cartQty(id) { const l = S.cust.cart.find(x => x.id === id); return l ? l.qty : 0; }
function addCart(id, d) {
  const m = menuItem(id), c = S.cust.cart; let l = c.find(x => x.id === id);
  if (!avail(m)) return { ok: false, msg: m.name + ' หมดแล้ว' };
  if (!l) { if (d < 0) return { ok: true }; l = { id, qty: 0, note: '' }; c.push(l); }
  const nq = l.qty + d;
  if (nq > m.stock) return { ok: false, msg: m.name + ' เหลือเพียง ' + m.stock + ' ที่' };
  l.qty = nq; if (l.qty <= 0) c.splice(c.indexOf(l), 1);
  return { ok: true };
}
const cartTotal = () => S.cust.cart.reduce((s, l) => s + menuItem(l.id).price * l.qty, 0);
const cartCount = () => S.cust.cart.reduce((s, l) => s + l.qty, 0);
function placeOrder() {
  const c = S.cust; if (!c.cart.length) return { ok: false, issues: ['ตะกร้าว่าง'] };
  const issues = [];
  c.cart.forEach(l => { const m = menuItem(l.id); if (!avail(m)) issues.push(m.name + ' หมดแล้ว กรุณาลบออกจากตะกร้า'); else if (m.stock < l.qty) issues.push(m.name + ' เหลือเพียง ' + m.stock + ' ที่'); });
  if (issues.length) return { ok: false, issues };
  const items = c.cart.map(l => { const m = menuItem(l.id); m.stock -= l.qty; S.sold[m.id] = (S.sold[m.id] || 0) + l.qty; return { id: m.id, name: m.name, price: m.price, qty: l.qty, note: l.note.trim(), art: m.art, all: m.all.slice() }; });
  const o = { id: S.orderSeq++, tableId: c.tableId, mine: true, who: custName(), items, status: 'sending', createdAt: Clock.now(), realStart: Date.now(), sentAt: null, sendMs: null, fails: 0 };
  S.orders.push(o); c.cart = [];
  if (c.menuOpenedAt) { S.orderTimes.push(Clock.now() - c.menuOpenedAt); c.menuOpenedAt = Clock.now(); }
  logEv('customer', 'ยืนยันคำสั่งซื้อ #' + o.id); attemptSend(o); return { ok: true, order: o };
}
function attemptSend(o) {
  o.status = 'sending'; o.realStart = Date.now(); emit();
  setTimeout(() => {
    if (o.status !== 'sending') return;
    if (S.failNext) {
      S.failNext = false; o.status = 'send_failed'; o.fails++;
      notify('staff', 'ออเดอร์ #' + o.id + ' โต๊ะ T' + o.tableId + ' ส่งครัวไม่สำเร็จ ระบบเก็บไว้และลองส่งใหม่', 'warn');
      emit(); setTimeout(() => { if (o.status === 'send_failed') attemptSend(o); }, 4500); return;
    }
    o.status = 'queued'; o.sentAt = Clock.now(); o.sendMs = Date.now() - o.realStart; S.sendTimes.push(o.sendMs);
    notify('kitchen', 'ออเดอร์ใหม่ #' + o.id + ' · โต๊ะ T' + o.tableId + ' (' + o.items.reduce((s, i) => s + i.qty, 0) + ' รายการ)', 'info'); emit();
  }, 900 + Math.random() * 800);
}
const CANCELLABLE = ['sending', 'send_failed', 'queued'];
function cancelOrder(id) {
  const o = S.orders.find(x => x.id === id); if (!o || CANCELLABLE.indexOf(o.status) < 0) return false;
  o.items.forEach(i => { const m = menuItem(i.id); m.stock += i.qty; S.sold[i.id] = Math.max(0, (S.sold[i.id] || 0) - i.qty); });
  o.status = 'cancelled'; o.cancelledAt = Clock.now(); S.recalcUntil = Date.now() + 2000; setTimeout(emit, 2050);
  notify('kitchen', 'ลูกค้ายกเลิกออเดอร์ #' + o.id + ' (ยังไม่เริ่มปรุง)', 'warn'); return true;
}
function startCooking(id) { const o = S.orders.find(x => x.id === id); if (!o || o.status !== 'queued') return; o.status = 'cooking'; o.startedAt = Clock.now(); logEv('kitchen', 'เริ่มปรุง #' + id); }
function markReady(id) { const o = S.orders.find(x => x.id === id); if (!o || o.status !== 'cooking') return; o.status = 'ready'; o.readyAt = Clock.now(); notify('staff', 'พร้อมเสิร์ฟ: ออเดอร์ #' + id + ' โต๊ะ T' + o.tableId, 'ok'); if (o.mine) toast('อาหารของคุณพร้อมเสิร์ฟแล้ว', 'ok'); }
function markServed(id) { const o = S.orders.find(x => x.id === id); if (!o || o.status !== 'ready') return; o.status = 'served'; o.servedAt = Clock.now(); logEv('staff', 'เสิร์ฟแล้ว #' + id); }
function setClosed(id, closed, reason) { const m = menuItem(id); m.closed = closed; m.closedReason = closed ? (reason || 'วัตถุดิบหมด') : ''; logEv('kitchen', (closed ? 'ปิดเมนู ' : 'เปิดเมนู ') + m.name); if (closed) notify('staff', 'ปิดเมนู "' + m.name + '" (' + m.closedReason + ')', 'warn'); }
function addMockOrder() {
  const ts = [3, 6, 8], tid = ts[Math.floor(Math.random() * ts.length)], pool = S.menu.filter(avail), items = [];
  for (let i = 0; i < 1 + Math.floor(Math.random() * 3); i++) { const m = pool[Math.floor(Math.random() * pool.length)]; if (!m || items.some(x => x.id === m.id) || m.stock < 1) continue; m.stock -= 1; S.sold[m.id] = (S.sold[m.id] || 0) + 1; items.push({ id: m.id, name: m.name, price: m.price, qty: 1, note: Math.random() < .3 ? 'เผ็ดน้อย' : '', art: m.art, all: m.all.slice() }); }
  if (!items.length) return;

/* ---------- bill & payment (UC-08, UC-11) ---------- */
const tableOrders = tid => S.orders.filter(o => o.tableId === tid && o.status !== 'cancelled' && !o.paid);
const tableTotal = tid => tableOrders(tid).reduce((s, o) => s + orderTotal(o), 0);
function openBill(tid, n) {
  const total = tableTotal(tid); if (total <= 0) return null;
  const base = Math.floor(total / n), parts = [];
  for (let i = 0; i < n; i++) parts.push({ amount: i === n - 1 ? total - base * (n - 1) : base, status: 'unpaid', method: null });
  S.bills[tid] = { total, n, parts, at: Clock.now() }; logEv('customer', 'ขอเช็คบิล T' + tid + ' ' + baht(total) + ' แยก ' + n + ' บิล'); return S.bills[tid];
}
function partPaid(tid, idx, method) {
  const b = S.bills[tid], p = b.parts[idx]; p.status = 'paid'; p.method = method; p.paidAt = Clock.now();
  S.pays.push({ tid, amount: p.amount, method, at: Clock.now() }); S.payMix[method] = (S.payMix[method] || 0) + 1;
  logEv('system', 'บันทึกการชำระ T' + tid + ' ' + baht(p.amount) + ' (' + PAY_LABEL[method] + ')');
  if (b.parts.every(x => x.status === 'paid')) finishBill(tid);
}
const PAY_LABEL = { cash: 'เงินสด', qr: 'สแกนจ่าย', transfer: 'โอนพร้อมสลิป' };
function finishBill(tid) {
  const b = S.bills[tid], os = tableOrders(tid);
  const snap = { tid, total: b.total, parts: b.parts.map(p => Object.assign({}, p)), orders: os.map(o => ({ id: o.id, items: o.items.map(i => Object.assign({}, i)) })), at: Clock.now(), no: 'RC-' + (S.orderSeq + 5000) };
  os.forEach(o => { o.paid = true; });
  const t = tableOf(tid); if (t) { t.status = 'free'; t.claimed = false; }
  delete S.bills[tid];
  if (S.cust.tableId === tid) { S.cust.receipt = snap; S.cust.tableId = null; S.cust.seated = null; S.cust.cart = []; S.cust.auth = null; S.cust.queueNo = null; }
  logEv('system', 'ปิดโต๊ะ T' + tid + ' → ว่าง · บันทึกลงรายงานยอดขาย');
  notify('staff', 'โต๊ะ T' + tid + ' ชำระครบ เปลี่ยนสถานะเป็น "ว่าง"', 'ok');
}

/* mode: ok | dup | mismatch ; sig identifies an uploaded file */
function paySlip(tid, idx, sig, mode, cb) {
  const p = S.bills[tid].parts[idx]; p.status = 'checking'; p.method = 'transfer'; emit();
  setTimeout(() => {
    if (!S.bills[tid] || S.bills[tid].parts[idx] !== p) return;
    let res = 'ok';
    if (sig && S.seenSlips.has(sig)) res = 'dup'; else if (mode === 'dup') res = 'dup'; else if (mode === 'mismatch') res = 'mismatch';
    if (res === 'ok') { if (sig) S.seenSlips.add(sig); partPaid(tid, idx, 'transfer'); }
    else { p.status = 'unpaid'; p.method = null; logEv('system', 'ตรวจสลิปไม่ผ่าน (' + (res === 'dup' ? 'สลิปซ้ำ' : 'ยอดไม่ตรง') + ') T' + tid); }
    cb && cb(res); emit();
  }, 1300);
}

  if (S.recalcUntil && Date.now() > S.recalcUntil) { S.recalcUntil = 0; changed = true; }

function updateTimers() {

  });
}

      '</div>' + (q.status === 'waiting' && ahead <= 2 ? msg('warn', '<b>ใกล้ถึงคิวแล้ว!</b> เหลืออีก ' + ahead + ' คิว กรุณาเตรียมตัวมาที่หน้าร้าน', 'bell') : '') +
      (q.status === 'called' ? msg('ok', 'พนักงานเรียกคิวของคุณแล้ว ไปที่เคาน์เตอร์เพื่อจัดโต๊ะ') : '') + '</div>';
  }
  const board = '<div class="card stack"><h3>จอคิวหน้าร้าน</h3><div class="row" style="gap:20px"><div><div class="lbl">กำลังเรียก</div><div class="big" style="font:800 44px var(--f-disp);color:var(--shu)">' + (serving ? serving.no : '—') + '</div></div><div><div class="lbl">รอคิว</div><div style="font:800 44px var(--f-disp)">' + waiting + '</div></div></div><hr class="div">' +
    (S.queue.list.filter(x => x.status === 'waiting').slice(0, 6).map(x => '<div class="row between"><span><b class="num">' + x.no + '</b> <span class="muted">' + esc(x.name) + (x.mine ? ' (คุณ)' : '') + '</span></span><span class="hint">' + x.people + ' คน</span></div>').join('') || '<p class="hint">ไม่มีคิวรอ</p>') + '</div>';
  return '<div class="view cols2 w21">' + left + board + '</div>';
}

/* ---------- customer: order ---------- */
function scanCard(p) {

  return '<div class="view stack"><div class="card stack"><div><h3>ขั้นที่ 1: สแกน QR ที่โต๊ะ</h3><p class="hint">ลูกค้านั่งโต๊ะที่พนักงานจัดให้ แล้วสแกน QR ที่โต๊ะ เลือกโต๊ะด้านล่างเพื่อจำลองการสแกน (เฉพาะโต๊ะที่มีลูกค้าและยังไม่มีใครสั่ง)</p></div>' +

}

    '<h4>' + esc(m.name) + (m.spicy ? ' <span class="spicy" aria-label="เผ็ด">' + '🌶'.repeat(m.spicy) + '</span>' : '') + '</h4><p class="desc">' + esc(m.desc) + '</p>' +
    '<div class="alls" aria-label="สารก่อภูมิแพ้">' + (m.all.length ? m.all.map(a => '<span class="a">' + a + '</span>').join('') : '<span class="a">ไม่มีสารก่อภูมิแพ้หลัก</span>') + '</div>' +
    '<div class="foot"><div><span class="price">' + baht(m.price) + '</span>' + (!sold && m.stock <= 5 ? '<div class="stockleft">เหลือ ' + m.stock + ' ที่</div>' : '') + (sold && m.closed ? '<div class="stockleft">' + esc(m.closedReason) + '</div>' : '') + '</div>' +
    (sold ? '<button class="btn sm" disabled>หมด</button>' : q ? stepper('cartqty', m.id, q, 'จำนวน ' + m.name) : btn('เพิ่ม', 'add', m.id, 'sm primary', 'plus')) + '</div></div></article>';
}

    '<div class="filters"><span class="lbl">แพ้อะไรไหม? ซ่อนเมนูที่มี:' + uc('UC-03') + '</span>' + ALLERGENS.map(a => '<button type="button" class="chk" aria-pressed="' + (avoid.indexOf(a) >= 0) + '" data-act="alg" data-arg="' + a + '">' + a + '</button>').join('') + '</div>';

    '<div class="seg" role="group"><button type="button" aria-pressed="' + (ui.osub !== 'orders') + '" data-act="osub" data-arg="menu">เมนู</button><button type="button" aria-pressed="' + (ui.osub === 'orders') + '" data-act="osub" data-arg="orders">ออเดอร์ของฉัน (' + S.orders.filter(o => o.mine && o.tableId === c.tableId).length + ')</button></div></div>' +
    (ui.osub === 'orders' ? ordersView(p) : cats + filt + (hidden ? '<p class="hint">ซ่อน ' + hidden + ' เมนูที่มีสารที่คุณเลือกหลีกเลี่ยง</p>' : '') +
      (items.length ? '<div class="menu-grid">' + items.map(m => dishCard(m, ui)).join('') + '</div>' : emptyBox('ไม่พบเมนูที่ตรงกับเงื่อนไข', 'ลองล้างคำค้นหาหรือปลดตัวกรองสารก่อภูมิแพ้')) +
      '<div class="carttab"><button class="btn primary ' + (ui.bump ? 'bump' : '') + '" data-act="cart" ' + (cnt ? '' : 'disabled') + '>' + ic('cart') + 'ตะกร้า · ' + cnt + ' รายการ · ' + baht(cartTotal()) + '</button></div>') + '</div>';
}

function cartSheet(p) {
  const ui = p.ui, c = S.cust, lines = c.cart.map(l => { const m = menuItem(l.id); return '<div class="line"><div class="thumb">' + art(m.art) + '</div><div><div class="nm">' + esc(m.name) + '</div><div class="hint num">' + baht(m.price) + ' × ' + l.qty + '</div>' +

  return '<div class="sheet-wrap" data-act="cartclose"><div class="sheet" role="dialog" aria-label="ตะกร้า" data-stop="1"><header><h3>ตะกร้าของฉัน' + uc('UC-04') + '</h3><button class="iconbtn" data-act="cartclose" aria-label="ปิด">' + ic('x') + '</button></header><div class="sbody">' +

    '<button class="btn primary block" data-act="confirm" ' + (c.cart.length ? '' : 'disabled') + '>' + ic('check') + 'ยืนยันสั่งอาหาร</button><p class="hint">ระบบสร้างออเดอร์ ตัดสต็อก และส่งไปหน้าจอครัวภายใน 3 วินาที' + uc('UC-13') + '</p></footer></div></div>';

  const cards = os.map(o => {
    const st = ORDER_STATUS[o.status], items = '<ul>' + o.items.map(i => '<li><span class="nm">' + i.qty + '× ' + esc(i.name) + (i.note ? '<small>คำขอ: ' + esc(i.note) + '</small>' : '') + '</span><span class="num">' + baht(i.price * i.qty) + '</span></li>').join('') + '</ul>';

    else if (o.status === 'send_failed') mid = msg('err', '<b>ส่งไม่สำเร็จ</b> ระบบเก็บออเดอร์ไว้ ลองส่งใหม่อัตโนมัติ และแจ้งพนักงานแล้ว') + '<div class="row">' + btn('ลองส่งใหม่เดี๋ยวนี้', 'retry', o.id, 'sm', 'refresh') + btn('เรียกพนักงาน', 'callstaff', null, 'sm', 'bell') + '</div>';
    else if (o.status !== 'cancelled') mid = timeline(o.status) + (o.sendMs ? '<p class="hint">ส่งถึงครัวใน ' + (o.sendMs / 1000).toFixed(1) + ' วินาที</p>' : '');

      '<div class="row between"><b class="num">' + baht(orderTotal(o)) + '</b>' + (CANCELLABLE.indexOf(o.status) >= 0 ? btn('ยกเลิกออเดอร์', 'cancel', o.id, 'sm danger', 'x') : '<span class="hint">' + (o.status === 'cooking' || o.status === 'ready' ? 'เริ่มปรุงแล้ว ยกเลิกไม่ได้' : '') + '</span>') + '</div></div>';

  if (ui.cartOpen) p.overlay = cartSheet(p);

  const tid = c.tableId, b = S.bills[tid], os = tableOrders(tid), total = tableTotal(tid), unserved = os.filter(o => o.status !== 'served').length;

/* ---------- charts (single series, one axis, hover tips) ---------- */
function salesChart() {
  const today = isoDate(Clock.now()), data = HISTORY.map(h => ({ lbl: new Date(new Date().setDate(new Date().getDate() + h.d)).toLocaleDateString('th-TH', { weekday: 'short' }), v: h.sales, o: h.orders })).concat([{ lbl: 'วันนี้', v: salesToday(), o: ordersToday(), today: true }]);
  const max = Math.max.apply(null, data.map(d => d.v)), top = Math.ceil(max / 10000) * 10000, W = 560, H = 230, L = 46, R = 8, T = 22, B = 28, iw = W - L - R, ih = H - T - B, bw = Math.min(40, iw / data.length * .56), gap = iw / data.length;
  let g = '', ticks = ''; for (let i = 0; i <= 4; i++) { const v = top / 4 * i, y = T + ih - ih * v / top; ticks += '<line class="gl" x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '" stroke-dasharray="' + (i ? '3 4' : '0') + '"/><text x="' + (L - 8) + '" y="' + (y + 4) + '" text-anchor="end">' + (v / 1000) + 'k</text>'; }
  const maxI = data.reduce((m, d, i) => d.v > data[m].v ? i : m, 0);
  data.forEach((d, i) => { const x = L + gap * i + (gap - bw) / 2, h = Math.max(2, ih * d.v / top), y = T + ih - h, r = Math.min(5, bw / 2);
    g += '<g class="col" data-tip="' + d.lbl + ': ' + baht(d.v) + ' · ' + d.o + ' ออเดอร์"><path class="bar-m ' + (d.today ? 'today' : '') + '" d="M' + x + ' ' + (y + h) + 'V' + (y + r) + 'a' + r + ' ' + r + ' 0 0 1 ' + r + ' -' + r + 'h' + (bw - 2 * r) + 'a' + r + ' ' + r + ' 0 0 1 ' + r + ' ' + r + 'V' + (y + h) + 'z"/><rect class="hit" x="' + (L + gap * i) + '" y="' + T + '" width="' + gap + '" height="' + ih + '"/>' +
      '<text x="' + (x + bw / 2) + '" y="' + (H - 9) + '" text-anchor="middle"' + (d.today ? ' class="lblv"' : '') + '>' + d.lbl + '</text>' + ((d.today || i === maxI) ? '<text class="lblv" x="' + (x + bw / 2) + '" y="' + (y - 6) + '" text-anchor="middle">' + (d.v / 1000).toFixed(1) + 'k</text>' : '') + '</g>'; });
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="ยอดขาย 7 วันล่าสุด หน่วยบาท">' + ticks + g + '</svg>';
}
